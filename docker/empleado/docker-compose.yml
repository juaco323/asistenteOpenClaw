services:
  openclaw-empleado:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_IMAGE}
    image: ${OPENCLAW_CONTAINER_NAME}:local
    container_name: ${OPENCLAW_CONTAINER_NAME}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${OPENCLAW_HOST_PORT}:${OPENCLAW_INTERNAL_PORT}"
    environment:
      NODE_ENV: production
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      # Misma razon que admin: config en /etc; sin :ro el Control UI puede guardar cambios.
      OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENCLAW_AGENTS_DEFAULTS_MODEL_PRIMARY: ${OPENCLAW_AGENTS_DEFAULTS_MODEL_PRIMARY:-}
      # GOG (OAuth Gmail): llavero en archivo en contenedor; contraseña solo vía .env del host
      GOG_KEYRING_BACKEND: file
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD:-}
      GOG_ACCOUNT: ${GOG_ACCOUNT:-}
    volumes:
      - ${OPENCLAW_STATE_DIR}:/home/node/.openclaw
      # Workspace versionado en el repo (no copia a ~/.openclaw-empleado/workspace).
      - ../../workspace-empleado:/home/node/.openclaw/workspace:rw
      # Skills compartidas del monorepo (web, email-gmail); code-audit vive en workspace-empleado/skills/
      - ../../skills/web:/home/node/.openclaw/workspace/skills/web:ro
      - ../../skills/email-gmail:/home/node/.openclaw/workspace/skills/email-gmail:ro
      - ./openclaw.json:/etc/openclaw/openclaw.json
      # Mismo criterio que admin: home del host + carpetas de usuario (Documentos, Descargas, …).
      - ${OPENCLAW_HOST_HOME}:${OPENCLAW_HOST_HOME}:rw
      # Alias bajo ~ del usuario node (SOUL.md / rutas cortas).
      - ${OPENCLAW_HOST_HOME}/Documentos:/home/node/Documentos:rw
      - ${OPENCLAW_HOST_HOME}/Imágenes:/home/node/Imágenes:rw
      - ${OPENCLAW_HOST_HOME}/Descargas:/home/node/Descargas:rw
      - ${OPENCLAW_HOST_HOME}/Escritorio:/home/node/Escritorio:rw
      # gog/gogcli guarda credenciales y llavero en ~/.config/gogcli (no en .config/gog)
      - ${OPENCLAW_HOST_HOME}/.config/gogcli:/home/node/.config/gogcli:rw
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    command:
      - node
      - dist/index.js
      - gateway
      - --allow-unconfigured
      - --port
      - "${OPENCLAW_INTERNAL_PORT}"
      - --bind
      - lan

  openclaw-empleado-llm-panel:
    build:
      context: ../admin/llm-test-panel
      dockerfile: Dockerfile
    image: openclaw-empleado-llm-panel:local
    container_name: openclaw-empleado-llm-panel
    restart: unless-stopped
    ports:
      - "${LLM_TEST_PANEL_HOST_PORT:-18795}:8080"
    environment:
      LLM_TEST_LOG_PATH: /workspace/.llm-test-runs.jsonl
      LLM_TEST_PANEL_PORT: "8080"
      LLM_TEST_PANEL_TITLE: "Histórico de pruebas LLM (workspace empleado)"
    volumes:
      - ../../workspace-empleado:/workspace:ro
