services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: openclaw-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d

  grafana:
    image: grafana/grafana:11.4.0
    container_name: openclaw-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-openclaw}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: openclaw-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: openclaw-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  llm-metrics-exporter:
    build:
      context: ../..
      dockerfile: docker/monitoring/llm-metrics-exporter/Dockerfile
    image: openclaw-llm-metrics-exporter:local
    container_name: openclaw-llm-metrics-exporter
    restart: unless-stopped
    ports:
      - "${LLM_METRICS_HOST_PORT:-9092}:9092"
    environment:
      OPENCLAW_REPO: /repo
      LLM_METRICS_JSONL_PATHS: /repo/workspace-admin/.llm-test-runs.jsonl,/repo/workspace-empleado/.llm-test-runs.jsonl,/repo/integrations/telegram-bot/data/llm-metrics.jsonl
      LLM_METRICS_SCAN_INTERVAL: "15"
    volumes:
      - ../../workspace-admin:/repo/workspace-admin:ro
      - ../../workspace-empleado:/repo/workspace-empleado:ro
      - ../../integrations/telegram-bot/data:/repo/integrations/telegram-bot/data:ro

volumes:
  prometheus-data:
  grafana-data:
