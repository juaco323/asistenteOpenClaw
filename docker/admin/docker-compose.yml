services:
  openclaw-admin:
    build:
      context: ../..
      dockerfile: docker/admin/Dockerfile
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_IMAGE}
    image: ${OPENCLAW_CONTAINER_NAME}:local
    container_name: ${OPENCLAW_CONTAINER_NAME}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${OPENCLAW_HOST_PORT}:${OPENCLAW_INTERNAL_PORT}"
    environment:
      NODE_ENV: production
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      # Config en el repo (bind). Debe ser lectura/escritura para que el Control UI
      # pueda guardar (modelo, etc.); :ro provoca EACCES al escribir .tmp junto al json.
      OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENCLAW_AGENTS_DEFAULTS_MODEL_PRIMARY: ${OPENCLAW_AGENTS_DEFAULTS_MODEL_PRIMARY:-}
      GOG_KEYRING_BACKEND: file
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD:-}
      GOG_ACCOUNT: ${GOG_ACCOUNT:-}
      OPENCLAW_WORKSPACE_PROFILE: admin
    volumes:
      - ${OPENCLAW_STATE_DIR}:/home/node/.openclaw
      # Workspace versionado en el repo (no copia a ~/.openclaw-admin/workspace).
      - ../../workspace-admin:/home/node/.openclaw/workspace:rw
      # Skills compartidas del monorepo (web, email-gmail); code-audit vive en workspace-admin/skills/
      - ../../skills/web:/home/node/.openclaw/workspace/skills/web:ro
      - ../../skills/email-gmail:/home/node/.openclaw/workspace/skills/email-gmail:ro
      - ./openclaw.json:/etc/openclaw/openclaw.json
      # Mismo criterio que empleado: el agente admin debe ver Documentos/Descargas del host.
      - ${OPENCLAW_HOST_HOME}:${OPENCLAW_HOST_HOME}:rw
      - ${OPENCLAW_HOST_HOME}/Documentos:/home/node/Documentos:rw
      - ${OPENCLAW_HOST_HOME}/Imágenes:/home/node/Imágenes:rw
      - ${OPENCLAW_HOST_HOME}/Descargas:/home/node/Descargas:rw
      - ${OPENCLAW_HOST_HOME}/Escritorio:/home/node/Escritorio:rw
      # Mismo árbol que en el host: credenciales + llavero en ~/.config/gogcli
      - ${OPENCLAW_HOST_HOME}/.config/gogcli:/home/node/.config/gogcli:rw
      - ../../workspace-empleado:/app/logs_shared:rw
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    command:
      - node
      - dist/index.js
      - gateway
      - --allow-unconfigured
      - --port
      - "${OPENCLAW_INTERNAL_PORT}"
      - --bind
      - lan

  # Panel de solo lectura del histórico JSONL de pruebas LLM (workspace admin).
  openclaw-admin-llm-panel:
    build:
      context: ./llm-test-panel
      dockerfile: Dockerfile
    image: openclaw-admin-llm-panel:local
    container_name: openclaw-admin-llm-panel
    restart: unless-stopped
    ports:
      - "${LLM_TEST_PANEL_HOST_PORT:-18794}:8080"
    environment:
      LLM_TEST_LOG_PATH: /workspace/.llm-test-runs.jsonl
      LLM_TEST_PANEL_PORT: "8080"
      LLM_TEST_PANEL_TITLE: "Histórico de pruebas LLM (workspace admin)"
    volumes:
      - ../../workspace-admin:/workspace:ro
