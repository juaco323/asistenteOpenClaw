services:
  telegram-openclaw-bot:
    build:
      context: ../..
      dockerfile: docker/telegram/Dockerfile
    container_name: telegram-openclaw-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_HOST_HOME: ${TELEGRAM_HOST_HOME:-/home/joaquin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../integrations/telegram-bot/data:/app/data
      - ../../workspace-admin/.llm-test-runs.jsonl:/data/llm-test-runs.jsonl:rw
      - ${TELEGRAM_HOST_HOME:-/home/joaquin}:/home/joaquin:ro
      # Escritura solo en carpeta de recepción (correo con adjunto vía Telegram); el resto del home sigue en ro.
      - ${TELEGRAM_HOST_HOME:-/home/joaquin}/Documentos/telegram-openclaw-incoming:${TELEGRAM_HOST_HOME:-/home/joaquin}/Documentos/telegram-openclaw-incoming:rw
